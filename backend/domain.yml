session_config:
  session_expiration_time: 60  # value in minutes
  carry_over_slots_to_new_session: true

intents:
  - greet
  - affirm
  - deny
  - menu
  - start_conversation
  - under_construction



responses:
  
  utter_greet:
    - text: "Buongiorno! Sono Peritus \n"

  utter_privacy-policy:
    - text: "Se continui a utilizzare le mie funzionalità, accetti la privacy polici disponibile a [Link]"

  utter_menu_principale:
    - text: "Desideri assistenza o informazioni?"
      buttons:
        - title: "Assistenza"
          payload: /request_assistance
        - title: "Informazioni generali"
          payload: /general_information
        - title: "Fissa appuntamento"
          payload: /commercial_information

  utter_under_construction:
    - text: "Sto ancora imparando questo argomento, torna più tardi!"

  utter_info_generali:
    - text: "Benvenuto! Il perito industriale è un professionista tecnico che progetta, gestisce e verifica impianti e processi nei settori industriale e civile, garantendo qualità, sicurezza ed efficienza.
             <br> Puoi trovare maggiori informazioni sulla presenza nella provincia di Como  <a href='https://peritiindustriali.como.it/'>qui</a>"


actions:
  - action_default_fallback
  - action_download_logo