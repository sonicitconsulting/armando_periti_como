session_config:
  session_expiration_time: 60  # value in minutes
  carry_over_slots_to_new_session: true

intents:
  - greet
  - affirm
  - deny
  - menu
  - start_conversation
  - under_construction
  - lev_1_info
  - lev_1_associazione
  - lev_1_legal
  - lev_1_eppi
  - confirm_solution
  - reject_solution
  - confirm_meeting
  - reject_meeting


slots:
  topic:
    type: text
    influence_conversation: true
    mappings:
      - type: custom 

  user_question:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: user_question_form
            requested_slot: user_question

  user_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text 
        conditions:
          - active_loop: user_data_form
            requested_slot: user_name


  user_email:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions : 
          - active_loop: user_data_form
            requested_slot: user_email

  user_phone:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions : 
          - active_loop: user_data_form
            requested_slot: user_phone

forms:
  user_question_form:
    required_slots:
      - user_question

  user_data_form:
    required_slots:
      - user_name
      - user_email
      - user_phone

responses:
  
  utter_greet:
    - text: "Buongiorno! Sono Peritus \n"

  utter_privacy-policy:
    - text: "Se continui a utilizzare le mie funzionalità, accetti la privacy polici disponibile a [Link]"

  utter_menu_principale:
    - text: "Dove posso esserti utile?"
      buttons:
        - title: "Informazioni generali"
          payload: /lev_1_info
        - title: "Associarsi"
          payload: /lev_1_associazione
        - title: "Normativa di riferimento"
          payload: /lev_1_legal
        - title: "Cassa di previdenza"
          payload: /lev_1_eppi


  utter_under_construction:
    - text: "Sto ancora imparando questo argomento, torna più tardi!"

  utter_info_generali:
    - text: "Benvenuto! Il perito industriale è un professionista tecnico che progetta, gestisce e verifica impianti e processi nei settori industriale e civile, garantendo qualità, sicurezza ed efficienza.
             <br> Puoi trovare maggiori informazioni sulla presenza nella provincia di Como  <a href='https://peritiindustriali.como.it/'>qui</a>."

  utter_ask_user_question:
    - text: "Di cosa hai bisogno?"

  utter_ask_user_name:
    - text: "Può lasciarmi il suo nome e cognome?"

  utter_ask_user_email:
    - text: "Può indicarmi un indirizzo email?"

  utter_ask_user_phone:
    - text: "E un recapito telefonico?"

  utter_ask_confirm_llm_solution:
    - text: "La soluzione proposta è stata utile?"
      buttons:
        - title: "Sì"
          payload: /confirm_solution
        - title: "No"
          payload: /reject_solution

  utter_exit_positive:
    - text: "Grazie per aver usato Peritus!"

  utter_exit_negative:
    - text: "Mi spiace di non essere stato utile. La conversazione è stata però registrata in forma anonima, così da poter arrichire in futuro la mia conoscenza e poter rispondere anche a questa domanda."

  utter_ask_for_book_meeting:
    - text: "Vuoi prendere un appuntamento?"
      buttons:
        - title: "Sì"
          payload: /confirm_meeting
        - title: "No"
          payload: /reject_meeting


actions:
  - action_default_fallback
  - action_download_logo
  - action_set_topic_associazione
  - action_set_topic_legal
  - action_set_topic_eppi
  - action_ask_llm
  - action_book_meeting
  - action_find_slots